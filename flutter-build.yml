name: Flutter Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # পুরোনো এনভায়রনমেন্টের জন্য

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11' # পুরোনো ফ্লাটারের উপযোগী জাভা

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.10.5' # প্রজেক্টের সাথে মিল রেখে পুরোনো ফ্লাটার ভার্সন

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-sound-null-safety # নাল সেফটি এরর এড়ানোর জন্য

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-bot-apk
          path: build/app/outputs/flutter-apk/app-release.apk
